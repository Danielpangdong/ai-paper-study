<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读中 · AI 论文学习站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234fd8ff'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="rtool">
  <div class="inner">
    <a class="bt" href="index.html">← 返回学习站</a>
    <div class="tt">
      <span class="t" id="rtTitle">加载中…</span>
      <div class="nav">
        <button class="bt" id="btPrev" title="上一篇（←）">‹ 上篇</button>
        <button class="bt" id="btNext" title="下一篇（→）">下篇 ›</button>
      </div>
    </div>
    <button class="bt primary" id="btOpen" title="在新窗口打开原文">↗ 独立打开</button>
    <button class="bt" id="btCopy" title="复制本页链接">⧉ 复制链接</button>
  </div>
</div>

<div class="loading" id="loading">
  <div>
    <div class="spinner"></div>
    <div>正在加载文章…</div>
    <div style="margin-top:8px;font-size:12px;opacity:.7">若长时间空白，可点击右上角「↗ 独立打开」</div>
  </div>
</div>
<iframe id="frame" title="文章正文"></iframe>

<script src="data/papers.js"></script>
<script>
(function () {
  "use strict";
  const papers = window.PAPERS.papers;
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));

  const f = new URLSearchParams(location.search).get("f") || "";
  const idx = papers.findIndex((p) => p.file === f);
  const paper = papers[idx] || null;
  const frame = document.getElementById("frame");
  const loading = document.getElementById("loading");

  document.title = (paper ? paper.title : "未找到文章") + " · AI 论文学习站";

  if (!paper) {
    loading.innerHTML = '<div><div class="big" style="font-size:40px">🧭</div><div>文章不存在，<a href="index.html" style="color:var(--cyan)">返回学习站</a></div></div>';
    return;
  }

  const byDate = [...papers].sort((a, b) => (a.date < b.date ? 1 : -1));
  const cur = byDate.findIndex((p) => p.file === paper.file);
  const prev = cur > 0 ? byDate[cur - 1] : null;
  const next = cur >= 0 && cur < byDate.length - 1 ? byDate[cur + 1] : null;

  document.getElementById("rtTitle").innerHTML =
    `<span class="tag" style="flex:none">${esc(paper.type)}</span> ${esc(paper.title)}`;

  const btPrev = document.getElementById("btPrev");
  const btNext = document.getElementById("btNext");
  btPrev.disabled = !prev;
  btNext.disabled = !next;
  const go = (p) => { if (p) location.href = "reader.html?f=" + encodeURIComponent(p.file); };
  btPrev.onclick = () => go(prev);
  btNext.onclick = () => go(next);
  document.getElementById("btOpen").onclick = () => window.open(paper.file, "_blank");
  document.getElementById("btCopy").onclick = () => {
    navigator.clipboard && navigator.clipboard.writeText(location.href).then(() => {
      const b = document.getElementById("btCopy");
      const old = b.textContent; b.textContent = "✓ 已复制"; b.classList.add("primary");
      setTimeout(() => { b.textContent = old; b.classList.remove("primary"); }, 1200);
    });
  };
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") go(prev);
    if (e.key === "ArrowRight") go(next);
  });

  frame.addEventListener("load", () => { loading.style.display = "none"; });
  frame.src = paper.file;
})();
</script>
</body>
</html>
